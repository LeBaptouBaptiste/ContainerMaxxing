<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schéma infra ContainerMaxxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg:#f4f4f4; --canvas:#ffffff; --fg:#111111; --muted:#5c5c5c; --line:#e2e2e2; --btn:#ffffff;
  --edge:#111111; --dot:#d9d9d9;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--canvas); }
.bar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.bar h1 span { font-weight: 500; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; flex: 1 1 320px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid; }
.legend .l-ext { border-color:#111; background:#111; }
.legend .l-data { border-color:#111; background:#ececec; }
.legend svg { vertical-align: middle; margin-right: 4px; }
.tools { display: flex; gap: 6px; align-items: center; }
.tools button { font: inherit; font-size: 13px; min-width: 34px; height: 32px; padding: 0 10px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); border-radius: 8px; cursor: pointer; }
.tools button:hover { border-color: var(--fg); }
.tools button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.pct { font-size: 12px; color: var(--muted); width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

.stage { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none;
  background: radial-gradient(circle, var(--dot) 1px, transparent 1.3px) 0 0 / 22px 22px, var(--bg); }
.stage.drag { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.canvas svg { display: block; background: var(--canvas); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.06); }

/* ---- schéma : noir et blanc ---- */
#schema text { font-family: Inter, system-ui, sans-serif; }
.zone { fill: #f6f6f6; stroke: #bdbdbd; stroke-width: 1.2; }
.zone.dashed { fill: #ffffff; stroke: #9a9a9a; stroke-dasharray: 5 4; }
.zone.dashed.z-gh, .zone.dashed.z-az, .zone.dashed.z-ph { fill: #ffffff; }
.z-az.dashed + .ztitle, .ztitle { font-size: 12.5px; font-weight: 700; fill: #111; letter-spacing: .01em; }
.ztitle.t-az, .ztitle.t-ph, .ztitle.t-gh { fill: #111; }

.node { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
.k-job { stroke-width: 1.1; stroke: #6f6f6f; }
.nd-d .node { fill: #ececec; }
.nd-ext .node { fill: #111111; }
.ntitle { font-size: 13px; font-weight: 600; fill: #111; }
.nsub { font-size: 11px; fill: #5c5c5c; }
.nd-ext .ntitle { fill: #ffffff; }
.nd-ext .nsub { fill: #c8c8c8; }

.trig { stroke: #111; stroke-width: 1.2; }
.tr-pr { fill: #ffffff; } .tr-main { fill: #e4e4e4; } .tr-tag { fill: #111111; }
.trigt { font-size: 11px; font-weight: 600; fill: #111; }
.tr-tag + .trigt { fill: #fff; }

.edge { fill: none; stroke: #111111; stroke-width: 1.4; stroke-linejoin: round; }
.edge.dot { stroke-dasharray: 4 4; }
.arrhead { fill: #111111; }
.elabel { font-family: "JetBrains Mono", ui-monospace, monospace !important; font-size: 10.5px; font-weight: 500; fill: #111;
  paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
</style>
</head>

nchor="middle">SBOM, Trivy, Dockle</text></g><g class="nd-gh"><rect class="node k-gh" x="1300" y="290" width="280" height="56" rx="8"/><text class="ntitle" x="1440.0" y="314.5" text-anchor="middle">API GitHub</text><text class="nsub" x="1440.0" y="329.5" text-anchor="middle">commits, tags, runs, jobs, journaux</text></g><g class="nd-d"><path class="node k-d" d="M1300,402 a140.0,7 0 0 0 280,0 a140.0,7 0 0 0 -280,0 v42 a140.0,7 0 0 0 280,0 v-42"/><text class="ntitle" x="1440.0" y="422.5" text-anchor="middle">GHCR</text><text class="nsub" x="1440.0" y="437.5" text-anchor="middle">public, signé, SBOM attesté</text></g><g class="nd-ext"><rect class="node k-ext" x="1300" y="20" width="280" height="56" rx="8"/><text class="ntitle" x="1440.0" y="44.5" text-anchor="middle">Sigstore</text><text class="nsub" x="1440.0" y="59.5" text-anchor="middle">Fulcio (cert. éphémère), Rekor</text></g><g class="nd-ext"><rect class="node k-ext" x="35" y="590" width="190" height="137" rx="8"/><text class="ntitle" x="130.0" y="632.5" text-anchor="middle">DNS voyager3.fr</text><text class="nsub" x="130.0" y="647.5" text-anchor="middle">containers2v → CNAME ACA</text><text class="nsub" x="130.0" y="662.5" text-anchor="middle">+ TXT asuid</text><text class="nsub" x="130.0" y="677.5" text-anchor="middle">-statique → CNAME phobos</text><text class="nsub" x="130.0" y="692.5" text-anchor="middle">CAA letsencrypt, digicert</text></g><g class="nd-ext"><rect class="node k-ext" x="55" y="787" width="150" height="56" rx="28.0"/><text class="ntitle" x="130.0" y="811.5" text-anchor="middle">Navigateur</text><text class="nsub" x="130.0" y="826.5" text-anchor="middle">jury, démo</text></g><g class="nd-az"><rect class="node k-az" x="310" y="630" width="230" height="80" rx="8"/><text class="ntitle" x="425.0" y="659.0" text-anchor="middle">Identité managée</text><text class="nsub" x="425.0" y="674.0" text-anchor="middle">id-gh-containermaxxing</text><text class="nsub" x="425.0" y="689.0" text-anchor="middle">Contributor sur rg-caas</text></g><g class="nd-az"><rect class="node k-az" x="580" y="640" width="190" height="60" rx="8"/><text class="ntitle" x="675.0" y="666.5" text-anchor="middle">Ingress HTTPS</text><text class="nsub" x="675.0" y="681.5" text-anchor="middle">certificat managé DigiCert</text></g><g class="nd-az"><rect class="node k-az" x="830" y="630" width="370" height="80" rx="8"/><text class="ntitle" x="1015.0" y="659.0" text-anchor="middle">Container App containers2v</text><text class="nsub" x="1015.0" y="674.0" text-anchor="middle">image @sha256, :8080, 0→1 réplique</text><text class="nsub" x="1015.0" y="689.0" text-anchor="middle">DATA_SOURCE=live</text></g><g class="nd-d"><path class="node k-d" d="M1320,637 a112.5,7 0 0 0 225,0 a112.5,7 0 0 0 -225,0 v66 a112.5,7 0 0 0 225,0 v-66"/><text class="ntitle" x="1432.5" y="662.0" text-anchor="middle">PostgreSQL 16 Flexible</text><text class="nsub" x="1432.5" y="677.0" text-anchor="middle">pg-containers2v-es, B1ms</text><text class="nsub" x="1432.5" y="692.0" text-anchor="middle">rôle cmaxxing_app</text></g><g class="nd-ph"><rect class="node k-ph" x="290" y="920" width="200" height="80" rx="8"/><text class="ntitle" x="390.0" y="949.0" text-anchor="middle">Nginx Proxy Manager</text><text class="nsub" x="390.0" y="964.0" text-anchor="middle">conteneur rootful proxyweb_app</text><text class="nsub" x="390.0" y="979.0" text-anchor="middle">Let&#x27;s Encrypt, HSTS</text></g><g class="nd-ph"><rect class="node k-ph" x="660" y="920" width="260" height="80" rx="8"/><text class="ntitle" x="790.0" y="949.0" text-anchor="middle">App Go distroless</text><text class="nsub" x="790.0" y="964.0" text-anchor="middle">build local, :8080</text><text class="nsub" x="790.0" y="979.0" text-anchor="middle">DATA_SOURCE=mock</text></g><g class="nd-d"><path class="node k-d" d="M1030,952 a115.0,7 0 0 0 230,0 a115.0,7 0 0 0 -230,0 v46 a115.0,7 0 0 0 230,0 v-46"/><text class="ntitle" x="1145.0" y="974.5" text-anchor="middle">PostgreSQL 16 (DHI) <script>
(() => {
  const W = 1640, H = 1110;
  const stage = document.getElementById('stage'), canvas = document.getElementById('canvas'), pct = document.getElementById('pct');
  let s = 1, x = 0, y = 0;
  const MIN = 0.1, MAX = 4;
  const apply = () => { canvas.style.transform = `translate(${x}px,${y}px) scale(${s})`; pct.textContent = Math.round(s * 100) + ' %'; };
  const zoomAt = (f, cx, cy) => { const ns = Math.min(MAX, Math.max(MIN, s * f)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  const fit = () => { const r = stage.getBoundingClientRect(); s = Math.min((r.width - 32) / W, (r.height - 32) / H); x = (r.width - W * s) / 2; y = (r.height - H * s) / 2; apply(); };
  const center = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  document.getElementById('zin').onclick = () => zoomAt(1.3, ...center());
  document.getElementById('zout').onclick = () => zoomAt(1 / 1.3, ...center());
  document.getElementById('fit').onclick = fit;
  document.getElementById('one').onclick = () => { const [cx, cy] = center(); zoomAt(1 / s, cx, cy); };
  stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect();
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)); zoomAt(f, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); zoomAt(e.shiftKey ? 1 / 1.8 : 1.8, e.clientX - r.left, e.clientY - r.top); });
  const pts = new Map(); let last = null;
  stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); stage.classList.add('drag'); last = null; });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { x += e.clientX - prev[0]; y += e.clientY - prev[1]; apply(); }
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const r = stage.getBoundingClientRect(); const mx = (a[0] + b[0]) / 2 - r.left, my = (a[1] + b[1]) / 2 - r.top;
      if (last) { x += mx - last.mx; y += my - last.my; zoomAt(d / last.d, mx, my); } last = { d, mx, my }; }
  });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) stage.classList.remove('drag'); };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') zoomAt(1.3, ...center()); else if (e.key === '-') zoomAt(1 / 1.3, ...center()); else if (e.key === '0') fit(); });
  window.addEventListener('resize', fit);
  fit();
})();
</script>
