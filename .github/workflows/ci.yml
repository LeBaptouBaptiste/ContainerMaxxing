# CI/CD de ContainerMaxxing : appelle la CI réutilisable container-ci.yml, qui sert
# aussi de template aux autres projets (voir template/README.md).
#
#   pull_request → build + scans + SBOM + audit de la CI (plumber) ; rien n'est poussé
#   push main    → + publish (tags main, sha-xxxxxxx), signé + SBOM attesté,
#                  + graphe de dépendances GitHub (Insights, alertes Dependabot)
#   push tag v*  → + deploy ACA + rapport POST /api/deployments + GitHub Release (SBOM)
#
# Le nom du job appelant (« CI ») préfixe ceux du workflow appelé : il ne doit contenir
# ni « publish » ni « deploy », que l'app utilise pour ranger les jobs dans ses étapes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # Plafond des permissions ; chaque job du workflow appelé n'en reçoit qu'une partie.
    permissions:
      contents: write          # release GitHub, graphe de dépendances
      packages: write          # push GHCR
      id-token: write          # cosign keyless, login Azure OIDC
      security-events: write   # SARIF de plumber
      actions: read            # plumber, date de début du run
    uses: ./.github/workflows/container-ci.yml
    with:
      image: ghcr.io/lebaptoubaptiste/containermaxxing
      dhi-login: true
      environment: prod
      aca-app: containers2v
      aca-resource-group: rg-caas
      app-url: https://containers2v.voyager3.fr
      version-path: /api/status
      version-jq: .app_version
      report-url: https://containers2v.voyager3.fr/api/deployments
    # Uniquement les secrets utiles, par leur nom (pas « secrets: inherit », qui les
    # transmettrait tous). Les secrets Azure et INGEST_TOKEN n'existent que dans
    # l'environnement « prod » : il faut quand même les transmettre ici, sinon ils sont
    # vides dans le workflow appelé. Seuls les jobs qui déclarent « prod » (déploiement,
    # rapport) en reçoivent la valeur.
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
