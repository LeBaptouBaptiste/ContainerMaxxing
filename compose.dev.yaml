# Environnement de développement (local uniquement, jamais en prod).
#   docker compose -f compose.dev.yaml up -d     → http://localhost:8080
#   docker compose -f compose.dev.yaml logs -f   → suivre les recompilations
#
# - app : recompile/relance le serveur Go à chaque modification d'un .go ;
#         sert le frontend depuis le disque (DEV_MODE) et recharge le navigateur.
# - web : recompile web/src/*.ts vers web/static/js/ à chaque modification.
# - db  : PostgreSQL 16 ; l'historique survit aux redémarrages (volume pgdata-dev).
# - redis : cache partagé (pas de persistance) ; l'app continue s'il est arrêté.
name: containermaxxing-dev

services:
  app:
    image: golang:1.25-alpine
    working_dir: /src
    command: sh scripts/dev.sh
    environment:
      DEV_MODE: "1"
      STATIC_DIR: /src/web/static
      APP_ENV: local
      GOFLAGS: -buildvcs=false
      DATABASE_URL: postgres://containermaxxing@db:5432/containermaxxing?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080" # loopback uniquement : pas exposé sur le réseau
    volumes:
      - .:/src
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /src
    command: sh scripts/web-dev.sh
    volumes:
      - .:/src
      - node_modules:/src/node_modules # isolé du poste hôte
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: containermaxxing
      POSTGRES_USER: containermaxxing
      # DEV UNIQUEMENT : pas de mot de passe, pour ne committer aucun secret.
      # Acceptable ici car la base n'a aucun port publié : seule l'app du même
      # projet compose peut la joindre. Le compose de prod utilise un secret.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "containermaxxing", "-d", "containermaxxing"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pur cache : pas de persistance sur disque, mémoire bornée, éviction LRU.
    # DEV UNIQUEMENT sans mot de passe (aucun port publié) ; en prod : --requirepass via un secret.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  gocache:
  gomod:
  node_modules:
  pgdata-dev:
